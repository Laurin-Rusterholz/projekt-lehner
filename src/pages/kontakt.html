<section class="page-head wrap">
  <p class="page-head__kicker">Kontakt</p>
  <h1>Wir freuen uns auf Ihre Nachricht</h1>
  <p class="page-head__lead">
    Rufen Sie an oder schreiben Sie uns eine E-Mail &ndash; wir melden uns zurück.
  </p>
</section>

<section class="section section--tight wrap">
  <ul class="contact-list">
    <li>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
      </span>
      <div>
        <span class="contact-list__label">E-Mail</span>
        <p style="margin:0"><a href="mailto:{{email}}">{{email}}</a></p>
      </div>
    </li>
    <li>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M6.5 3h4l1.6 4-2.2 1.4a12 12 0 0 0 5.7 5.7L17 11.9l4 1.6v4a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.2 2 2 0 0 1 6.5 3Z"/></svg>
      </span>
      <div>
        <span class="contact-list__label">Telefon</span>
        <p style="margin:0"><a href="tel:{{phone-href}}">{{phone}}</a></p>
      </div>
    </li>
    <li>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
      </span>
      <div>
        <span class="contact-list__label">Adresse</span>
        <address style="font-style:normal">
          Familie Lehner<br>
          9035 Grub AR<br>
          Schweiz
        </address>
        <p class="hint" style="font-size:.88rem">In der Nähe von St. Gallen. Besuche nur nach Absprache.</p>
      </div>
    </li>
  </ul>
</section>
