<section class="page-head wrap">
  <p class="page-head__kicker">Abgabe</p>
  <h1>Ein Kitten zieht bei Ihnen ein</h1>
  <p class="page-head__lead">
    Preis, Reservierung und Termin besprechen wir lieber am Telefon als über
    eine Preisliste &ndash; ein Kitten ist kein Versandartikel. Rufen Sie einfach an:
  </p>
  <div class="btn-row" style="margin-top:1.1rem">
    <a class="btn btn--primary" href="tel:{{phone-href}}">{{phone}}</a>
    <a class="btn btn--ghost" href="mailto:{{email}}">{{email}}</a>
  </div>
</section>

<section class="section section--tight wrap">
  <h2>Was uns am Telefon am meisten gefragt wird</h2>
{{faq}}
</section>
