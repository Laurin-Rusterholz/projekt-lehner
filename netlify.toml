# Netlify-Konfiguration
# Die fertige Website liegt im Ordner docs/ (Build-Ergebnis von build.mjs).
# Ohne diese Angabe veröffentlicht Netlify das Repo-Root und zeigt nur 404.

[build]
  # Drei Schritte: Bilder holen, Website bauen, Ergebnis prüfen.
  #
  # Der Bilder-Schritt darf den Build NICHT umbringen. Er lädt von der alten
  # Website; ist die gerade nicht erreichbar, wäre sonst der ganze Deploy weg
  # und Netlify liesse den vorherigen Stand stehen — die Seite sähe dann
  # unverändert aus, ohne dass jemand erführe warum.
  #
  # pruefe-ausgabe.mjs ist der Wächter: Er bricht ab, wenn Seiten fehlen ODER
  # wenn die alten Auslieferungsflächen (/vorschau/, /verwaltung/) wieder
  # auftauchen. Der Rahmen für die Kundschaft ist allein der
  # FlowerTech-Kundenlink; dieses Repo liefert nur die Website.
  command = "(node scripts/fetch-images.mjs || echo 'Bilder uebersprungen — Build laeuft weiter') && node build.mjs && node scripts/pruefe-ausgabe.mjs"
  publish = "docs"

[build.environment]
  NODE_VERSION = "20"

# Netlify installiert die Abhängigkeiten (sharp) automatisch. Das
# fetch-Skript lädt die Originalbilder der alten Website und erzeugt
# daraus verkleinerte WebP/JPEG-Varianten – erst dadurch werden die
# Bilder auf dem Handy schnell und scharf.

# ─── Sicherheits-Kopfzeilen ──────────────────────────────────────────────────
# Einbetten darf die Seite nur der FlowerTech-Kundenlink (und sie selbst) —
# das ist der Clickjacking-Schutz. X-Frame-Options kann keine fremde Herkunft
# erlauben und bleibt deshalb weg; frame-ancestors ist die massgebliche Regel.
#
# Bewusst OHNE script-src/style-src: Die Seite trägt eingebettetes JSON-LD und
# wunsch.js fügt im Vorschau-Rahmen ein <style> ein — eine strikte CSP dafür
# braucht Hashes und einen Probelauf auf Staging (siehe SECURITY_AUDIT.md),
# sonst risse sie Sichtbares ab, ohne dass es hier jemand merkte.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://flowertech.ch https://www.flowertech.ch; object-src 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# Die Abschrift der veröffentlichten Inhalte (build.mjs → inhalt.json) darf der
# FlowerTech-Kundenlink lesen: Nur so kann die Verwaltung dort zeigen, was HEUTE
# auf dieser Website steht, statt leer dazustehen. Freigegeben ist genau diese
# eine Datei und genau diese eine Herkunft; der Inhalt ist ohnehin öffentlich.
[[headers]]
  for = "/inhalt.json"
  [headers.values]
    Access-Control-Allow-Origin = "https://flowertech.ch"
    Cache-Control = "public, max-age=60"
